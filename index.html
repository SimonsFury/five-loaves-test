#fl-glow { left: -20%; top: -20%; width: 140%; height: 140%; border-radius: 50%; opacity: 0;
	background: radial-gradient(closest-side, rgba(255, 222, 130, 0.95), rgba(246, 180, 90, 0.4) 55%, rgba(242, 166, 90, 0) 100%); mix-blend-mode: screen; }
#fl-basket.glow #fl-glow { animation: fl-bloom 1.1s ease-out forwards; }
@keyframes fl-bloom { 0% { opacity: 0; transform: scale(0.8); } 35% { opacity: 1; } 100% { opacity: 0.6; transform: scale(1.12); } }
/* a loaf or a fish: lands from above (it starts big, near the eye, and settles into the basket) */

	72% { transform: translate(-50%, -50%) rotate(var(--r)) scale(calc(0.95 * var(--sx)), 0.95); }
	100% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--r)) scale(var(--sx), 1);
		filter: blur(0) drop-shadow(calc(6 * var(--u)) calc(12 * var(--u)) calc(9 * var(--u)) rgba(20, 10, 4, 0.7)); }
}
/* a puff of flour where a loaf lands */

	background: rgba(255, 244, 222, 0.85); animation: fl-flour 0.7s ease-out forwards; }
@keyframes fl-flour { 0% { opacity: 0.9; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); } }

#fl-verse { left: calc(100 * var(--u)); width: calc(880 * var(--u)); top: calc((var(--cy) + 400) * var(--u)); text-align: center;
	font: italic calc(44 * var(--u)) / 1.35 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; color: #f0e2c8;

}

<script>
// The loading screen's motion. Progress: the download fills four fifths (one loaf each), the start
// of the game the last; then the two fish, the glow, and the game shows through as the screen fades.
(function () {
	const de = (navigator.language || 'en').toLowerCase().startsWith('de');
	const T = de ? {
		verse: 'Es ist ein Knabe hier, der hat fünf Gerstenbrote und zwei Fische; doch was ist das für so viele?',
		ref: 'Johannes 6,9', loading: 'Wird geladen', tag: 'loader/tagline-de.png', lang: 'de',
	} : {
		verse: 'Here is a boy with five barley loaves and two small fish. But what difference will these make among so many?',
		ref: 'John 6:9', loading: 'Loading', tag: 'loader/tagline-en.png', lang: 'en',
	};
	document.documentElement.lang = T.lang;
	const fl = document.getElementById('fl');
	const col = document.getElementById('fl-col');
	const basket = document.getElementById('fl-basket');
	const pct = document.getElementById('fl-pct');
	const tag = document.getElementById('fl-tag');
	tag.onload = () => col.style.setProperty('--tag-h', tag.naturalHeight / 2);  // drawn twice as big
	tag.src = T.tag;
	const verse = document.getElementById('fl-verse');
	verse.textContent = T.verse;
	const ref = document.createElement('b');
	ref.textContent = T.ref;
	verse.appendChild(ref);

	// the column: 1080 units wide, as tall as the screen (taller phones see more, like keep_width)
	function layout() {
		const vw = window.innerWidth, vh = window.innerHeight;
		const u = Math.min(vw, vh * 1080 / 1920) / 1080;
		const h = vh / u;
		col.style.left = ((vw - 1080 * u) / 2) + 'px';
		col.style.width = (1080 * u) + 'px';
		col.style.setProperty('--u', u + 'px');
		col.style.setProperty('--h', h);
		// the basket sits under the line, the verse under the basket (make_loader.py preview: same numbers)
		col.style.setProperty('--cy', Math.round(h * 0.07 + 510 + 60 + 350));
	}
	layout();
	window.addEventListener('resize', layout);
	for (let k = 0; k < 18; k++) {
		const m = document.createElement('span');
		m.className = 'fl-mote';
		const size = 4 + Math.random() * 7;
		m.style.width = m.style.height = 'calc(' + size + ' * var(--u))';
		m.style.left = (Math.random() * 100) + '%';
		m.style.top = (25 + Math.random() * 65) + '%';
		m.style.setProperty('--mx', 'calc(' + (Math.random() * 80 - 40) + ' * var(--u))');
		m.style.setProperty('--my', 'calc(' + -(160 + Math.random() * 200) + ' * var(--u))');
		const life = 9 + Math.random() * 7;
		m.style.animationDuration = life + 's';
		m.style.animationDelay = -(Math.random() * life) + 's';
		col.appendChild(m);
	}

	// five loaves in a ring inside the basket (top first, clockwise), two fish head to tail on them.
	// 0.25.1 (Simon: place the loaves better): a little smaller and further apart, each a touch
	// uneven like real loaves ([angle, ring, size]), and each casts a shadow on what lies below
	const S = 700;
	const UNEVEN = [[4, 0.02, 0.03], [-3, -0.03, -0.04], [5, 0.03, 0.02], [-4, -0.01, -0.03], [2, 0, 0.04]];
	const pieces = [];
	for (let k = 0; k < 5; k++) {
		const [da, dr, ds] = UNEVEN[k];
		const th = (-90 + 72 * k + da) * Math.PI / 180;
		const ring = S * 0.235 * (1 + dr);
		pieces.push({src: 'loader/loaf.webp', x: S / 2 + Math.cos(th) * ring, y: S / 2 + Math.sin(th) * ring, w: S * 0.285 * (1 + ds), r: -18 + 9 * k, loaf: true});
	}
	pieces.push({src: 'loader/fish.webp', x: S / 2, y: S / 2 - S * 0.065, w: S * 0.4, r: 8, flip: false});
	pieces.push({src: 'loader/fish.webp', x: S / 2, y: S / 2 + S * 0.065, w: S * 0.4, r: 8, flip: true});
	const els = pieces.map((p) => {
		const d = document.createElement('div');
		d.className = 'fl-piece' + (p.loaf ? '' : ' fish') + (p.flip ? ' flip' : '');
		d.style.left = 'calc(' + p.x + ' * var(--u))';
		d.style.top = 'calc(' + p.y + ' * var(--u))';
		d.style.setProperty('--w', 'calc(' + p.w + ' * var(--u))');
		d.style.setProperty('--r', p.r + 'deg');
		const im = document.createElement('img');
		im.src = p.src;
		im.alt = '';
		d.appendChild(im);
		basket.appendChild(d);
		return d;
	});

	function land(i) {
		const d = els[i];
		if (!d || d.classList.contains('in')) return;
		d.classList.add('in');
		if (!pieces[i].loaf) return;
		setTimeout(() => { // flour puffs up where the loaf comes down
			for (let k = 0; k < 7; k++) {
				const a = Math.PI * 2 * k / 7 + Math.random() * 0.5;
				const f = document.createElement('span');
				f.className = 'fl-flour';
				f.style.left = 'calc(' + pieces[i].x + ' * var(--u))';
				f.style.top = 'calc(' + pieces[i].y + ' * var(--u))';
				f.style.setProperty('--dx', 'calc(' + Math.cos(a) * 120 + ' * var(--u))');
				f.style.setProperty('--dy', 'calc(' + Math.sin(a) * 90 + ' * var(--u))');
				basket.appendChild(f);
				setTimeout(() => f.remove(), 800);
			}
		}, 380);
	}

	const state = {download: 0, downloadedAt: 0, started: false};
	window.flLoader = state;
	let shown = 0, landed = 0, nextAt = 0, finale = false, running = true;
	const t0 = performance.now();
	const pictures = ['wood.webp', 'logo.webp', 'basket.webp', 'loaf.webp'].map((n) => new Promise((done) => {
		const im = new Image();
		im.onload = im.onerror = done;
		im.src = 'loader/' + n;
	}));
	// the screen appears whole once its pictures are in (at most 2.5 s), never piece by piece
	window.flLoaderFirst = Promise.race([Promise.all(pictures), new Promise((go) => setTimeout(go, 2500))]).then(() => fl.classList.add('ready'));

	function frame() {
		if (!running) return;
		const t = (performance.now() - t0) / 1000;
		// the download fills 80 %; while the browser readies the game it creeps on towards 96 %
		let real = 0.8 * state.download;
		if (state.download >= 1) {
			if (!state.downloadedAt) state.downloadedAt = t;
			real = 0.8 + 0.16 * (1 - Math.exp(-(t - state.downloadedAt) / 2.5));
		}
		if (state.started) real = 1;
		shown = Math.max(shown, real);
		pct.textContent = T.loading + ' ' + Math.floor(shown * 100) + ' %';
		pct.setAttribute('aria-valuenow', Math.floor(shown * 100));
		// one loaf per fifth; the fifth only when the game is ready; at least 0.14 s apart
		const want = state.started ? 5 : Math.min(4, Math.floor(shown * 5 + 1e-6));
		if (fl.classList.contains('ready') && landed < want && t >= nextAt) {
			land(landed);
			landed += 1;
			nextAt = t + (state.started ? 0.14 : 0.3);
		}
		if (state.started && landed >= 5 && !finale) {
			finale = true;
			setTimeout(() => land(5), 260);
			setTimeout(() => land(6), 400);
			setTimeout(() => basket.classList.add('glow'), 620);
			setTimeout(() => fl.classList.add('gone'), 1250);
			setTimeout(() => { running = false; fl.remove(); }, 1750);
		}
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
}());
</script>
